      "put": {
        "summary": "Set Card Status",
        "description": "Use this BaaS endpoint to lock and unlock the cardholder's card upon their request. This same endpoint is also used to mark a card as lost, stolen and damaged.",
        "operationId": "set-card-status",
        "parameters": [
          {
            "name": "payfare_id",
            "in": "path",
            "description": "The UUID of the Payfare user.",
            "schema": {
              "type": "string",
              "default": "f47f0efd-03b0-4402-ad97-cc5c0367bc9c"
            },
            "required": true
          },
          {
            "name": "card_id",
            "in": "path",
            "description": "The UUID of the Payfare card.",

expiring\": false,\n               \"reissue_limit_reached\": false,\n               \"profile_recently_updated\": false\n           }\n       ],\n       \"auto_method\": {\n           \"ting\": \"ff928fb9-be01-4046-a1e8-03b783baa919\",\n           \"method_type\": \"card\",\n           \"is_virtual\": false,\n           \"meta\": {\n               \"proxy\": \"110195056508443\"\n           }\n       }\n   },\n   \"message\": \"\"\n}"

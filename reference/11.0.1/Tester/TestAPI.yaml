openapi: 3.0.0
info:
  title: Test API
  description: This is a test API to demonstrate OpenAPI structure with custom extensions
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production server

paths:
  /items:
    get:
      summary: Get list of items
      description: Returns a list of items
      x-group-name: ItemGroup
      x-proxy-names:
        - itemProxy1
        - itemProxy2
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        '500':
          description: Internal server error

  /items/{itemId}:
    get:
      summary: Get an item by ID
      description: Returns a single item
      x-group-name: ItemGroup
      x-proxy-names:
        - itemProxy1
        - itemProxy3
      parameters:
        - name: itemId
          in: path
          required: true
          description: ID of the item to fetch
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Item not found
        '500':
          description: Internal server error

  /orders:
    post:
      summary: Create an order
      description: Creates a new order
      x-group-name: OrderGroup
      x-proxy-names:
        - orderProxy1
        - orderProxy2
      requestBody:
        description: Order object that needs to be added
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order created
        '400':
          description: Invalid input
        '500':
          description: Internal server error

components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    ItemList:
      type: array
      items:
        $ref: '#/components/schemas/Item'

    OrderInput:
      type: object
      properties:
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        totalAmount:
          type: number
          format: float

    Order:
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string

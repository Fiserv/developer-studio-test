    Document:
      type: object
      properties:
        type:
          type: string
          description: Document type
          enum:
          - CNPJ
          - RFC_PM
          - RFC_PF
          - CUIT
          example: CNPJ
        number:
          type: string
          description: |
            Document number/value.

            - Use either the \"number\" or \"value\" property (both are accepted).
            - The \"number\" property is kept for backward compatibility.
            - Format and allowed characters depend on the document type.

            **Examples:**

            | Type                | Masked example                  | Unmasked example            |
            |---------------------|---------------------------------|-----------------------------|
            | CNPJ (numeric)      | {"number":"60.664.745/0001-87"} | {"number":"60664745000187"} |
            | CNPJ (alphanumeric) | {"value":"N9.NE6.XUD/AKD2-36"}  | {"value":"N9NE6XUDAKD236"}  |
            | CPF                 | {"number":"123.456.789-09"}     | {"number":"12345678909"}    |
            | RFC_PF              | {"number":"GODE561231GR8"}      |                             |
            | RFC_PM              | {"number":"ABC123456T12"}       |                             |

            Also accepted for CNPJ (alphanumeric): {"number":"N9.NE6.XUD/AKD2-36"}
          example: 60.664.745/0001-87
          minLength: 1
      required:
      - number
      - type
      title: DocumentDTO

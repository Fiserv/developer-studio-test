            address account key (addressPixKey) was not provided.
          example: 00.000.000/0001-00
        ispb:
          type: string
          description: "ISPB: Brazilian Payment System Identifier. Required if address\
            \ account key (addressPixKey) was not provided."
          example: "00000000"

    DocumentRoot:
      type: object
      properties:
        type:
          type: string
          description: Document type
          enum:
          - CNPJ
          - RFC_PM
          - RFC_PF
          - CUIT
          example: CNPJ
        number:
          type: string
          description: |
            Document number/value.

            - Use either the \"number\" or \"value\" property (both are accepted).
            - The \"number\" property is kept for backward compatibility.
            - Format and allowed characters depend on the document type.

            **Examples:**

            | Type                     | Masked example                  | Unmasked example            |
            |--------------------------|---------------------------------|-----------------------------|
            | Root CNPJ (numeric)      | {"number":"60.664.745/*"}       | {"number":"60664745"}       |
            | CNPJ (numeric)           | {"number":"60.664.745/0001-87"} | {"number":"60664745000187"} |
            | Root CNPJ (alphanumeric) | {"value":"I9.SCZ.IU8/*"}        | {"value":"I9SCZIU8"}        |
            | CNPJ (alphanumeric)      | {"value":"I9.SCZ.IU8/J5PO-08"}  | {"value":"I9SCZIU8J5PO08"}  |

            Also accepted for CNPJ (alphanumeric): {"number":"I9.SCZ.IU8/*"}
          example: 60.664.745/*
          minLength: 1
          pattern: '^([A-Z0-9]{12}[0-9]{2})$|^([A-Z0-9]{2}\.[A-Z0-9]{3}\.[A-Z0-9]{3}/[A-Z0-9]{4}-[0-9]{2})$|^([A-Z0-9]{8})$|^([A-Z0-9]{2}\.[A-Z0-9]{3}\.[A-Z0-9]{3}/\*)$'
      required:
      - number
      - type
      title: DocumentRoot
    SearchTefRequest:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/DocumentRoot"
          description: The document to use for search
        $pageoffset:
          type: integer
          format: int32
          default: 1
          description: "Specify the current page to be displayed in the paginated\
            \ results. If the not provided, default is 1"
          minimum: 1
        $pagelimit:
          type: integer
          format: int32
          default: 10
          description: "Specify the number of items to be displayed on each page.\
            \ If the not provided, default is 10"
          maximum: 1000

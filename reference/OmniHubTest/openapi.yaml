      summary: Update an existing merchant configuration
      description: This endpoint allows you to update an existing merchant configuration.
      operationId: patchMerchant
      parameters:
      - name: FSV-partner-merchant-config
        in: header
        required: true
        schema:
          type: string
      - name: opid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMerchantOnboardingRequestDTO"
            examples:
              ? "Update merchant config: Add or update DLOCAL provider - add route\n"
              : description: |
                  Update merchant config with DLOCAL provider - Route creation example.<br/>
                  - It will create a new provider of type DLOCAL if there's no provider of this type associated with the configuration.<br/>
                  - It will create a new route if routes[].routeId is not provided.<br/>
                  - Make sure the routes[].productId is not already associated with the provider.
                value:
                  merchantName: My merchant
                  providers:
                  - type: DLOCAL
                    dlocalId: DLOC1234
                    routes:
                    - productId: 1
                      priority: 1
                  callbackConfig:
                    callbackUrl: https://www.example.com/callback
                    apiKey: my-api-key-size-must-be-between-24-and-50
                    apiSecret: my-api-secret-size-must-be-between-32-and-64
              ? "Update merchant config: Update existing DLOCAL provider - update\
                \ route\n"
              : description: |
                  Update merchant config with DLOCAL provider - Route editing example.<br/>
                  - We need to provide a routeId for updating. Make sure the route already exists.<br/>
                  - Available fields to update: <b>priority</b> and <b>productId</b>
                value:
                  merchantName: My merchant
                  providers:
                  - type: DLOCAL
                    dlocalId: DLOC1234
                    routes:
                    - productId: 1
                      priority: 2
                      routeId: "1"
              ? "Update merchant config: Update DLOCAL provider - update dlocalId\n"
              : description: |
                  Update merchant config with DLOCAL provider - update dlocalId.<br/>
                  - Make sure the provider already exists.
                value:
                  merchantName: My merchant
                  providers:
                  - type: DLOCAL
                    dlocalId: DLOC1234UPDATED
              ? "Update merchant config: Update merchant name\n"
              : description: |
                  Update merchant config with DLOCAL provider - update merchant name.<br/>
                  - Make sure the configuration already exists.
                value:
                  merchantName: My merchant name updated
              ? "Update merchant config: Update callback url\n"
              : description: |
                  Update merchant config with DLOCAL provider - update callback url.<br/>
                  - Make sure the configuration already exists.
                value:
                  callbackConfig:
                    callbackUrl: https://www.example.com/callback-updated
        required: true

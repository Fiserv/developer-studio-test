        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized
        "408":
          description: Request Timeout
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveWebhookV4ResponseDTO"
              examples:
                When no authentication is configured:
                  description: When no authentication is configured
                  value:
                    url: https://example.your-application-url.here/service-to-receive-callback
                    authType: NONE
                When OAuth2 is configured:
                  description: When OAuth2 is configured
                  value:
                    url: https://example.your-application-url.here/service-to-receive-callback
                    authType: OAUTH2
                    authSettings:
                      clientIdConfigured: true
                      clientSecretConfigured: true
                      grantType: client_credentials
                      apiKeyConfigured: false
                      apiSecretConfigured: false
                When HMAC is configured:
                  description: When HMAC is configured
                  value:
                    url: https://example.your-application-url.here/service-to-receive-callback
                    authType: HMAC
                    authSettings:
                      clientIdConfigured: false
                      clientSecretConfigured: false
                      apiKeyConfigured: true
                      apiSecretConfigured: true
      x-group-name: A.2 Webhooks
      x-proxy-name: Retrieve webhook information
    put:
      tags:
      - A.2 Webhooks
      summary: Create or update your webhook configuration
      description: Create or update your webhook configuration
      operationId: updateWebhookV4
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookV4RequestDTO"
            examples:
              ? "An example to configure webhook without authentication.\n"
              : description: Configure webhook without authentication
                value:
                  url: https://example.your-application-url.here/service-to-receive-callback
                  authType: NONE
              ? "An example to configure webhook with OAuth2 authentication.\n"
              : description: Configure webhook with OAuth2 authentication
                value:
                  url: https://example.your-application-url.here/service-to-receive-callback
                  authType: OAUTH2
                  authSettings:
                    authUrl: https://example.com/auth
                    clientId: '*****'
                    clientSecret: '*****'
                    grantType: client_credentials
              ? "An example to configure webhook with HMAC validation.\n"
              : description: Configure webhook with HMAC validation
                value:
                  url: https://example.your-application-url.here/service-to-receive-callback
                  authType: HMAC
                  authSettings:
                    apiKey: '*****'
                    apiSecret: '*****'
        required: true

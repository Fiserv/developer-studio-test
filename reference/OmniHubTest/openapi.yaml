components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    CallbackAuthenticationSettingsV4DTO:
      type: object
      properties:
        authUrl:
          type: string
          description: Authentication URL. Mandatory if <code>authType</code> is 'OAUTH2'.
          example: https://example.com/auth
          maxLength: 255
          minLength: 1
        clientId:
          type: string
          description: Client id. Mandatory if <code>authType</code> is 'OAUTH2'.
          maxLength: 36
          minLength: 1
        clientSecret:
          type: string
          description: Client Secret. Mandatory if <code>authType</code> is 'OAUTH2'.
          maxLength: 255
          minLength: 1
        grantType:
          type: string
          description: Grant type. Mandatory if <code>authType</code> is 'OAUTH2'.
          example: client_credentials
          maxLength: 255
          minLength: 1
        apiKey:
          type: string
          description: Api Key. Mandatory if <code>authType</code> is 'HMAC'.
          maxLength: 255
          minLength: 1
        apiSecret:
          type: string
          description: Api Secret. Mandatory if <code>authType</code> is 'HMAC'.
          maxLength: 255
          minLength: 1
      title: CallbackAuthenticationSettingsV4DTO
    CreateWebhookV4RequestDTO:
      type: object
      properties:
        url:
          type: string
          description: URL to receive the callback notification
          example: https://example.your-application-url.here/service-to-receive-callback
          maxLength: 255
          minLength: 1
        authType:
          type: string
          description: |
            Authentication type used during webhook

            **Examples:**
            | Authentication | Description                                                  |
            |-------------- |---------------------------------------------------------------|
            | NONE          | No authentication.                                            |
            | OAUTH2        | Requests a Bearer token before sending the webhook.           |
            | HMAC          | Generate a message digest using HMAC for validation purposes. |
          enum:
          - NONE
          - OAUTH2
          - HMAC
        authSettings:
          $ref: "#/components/schemas/CallbackAuthenticationSettingsV4DTO"
          description: Object that contains settings for authentication. Required
            if <code>authType</code> is not 'NONE'.
      required:
      - authType
      - url
      title: CreateWebhookV4RequestDTO
    PixGatewayAutomaticPixSchema:
      type: object
      properties:
        agency:
          type: string
          description: Agency
          example: "0123"
          minLength: 1
        accountNumber:
          type: string
          description: Account number
          example: 1672391
          minLength: 1
        accountType:
          type: string
          description: |
            Account type. Valid values: CORRENTE, POUPANCA or PAGAMENTO. <br/>
          example: CORRENTE
          minLength: 1
        agreement:
          type: string
          description: "Agreement code, required when merchant has more than one agreement\
            \ associated with the same agency and account"
          example: 1234567890
        _links:
          type: object
          properties:
            self:
              type: object
              properties:
                href:
                  type: object
                  example: string
                type:
                  type: object
                  example: string
      required:
      - accountNumber
      - accountType
      - agency
      title: PixGatewayAutomaticPixSchema
    CallbackCredentialSettings:
      type: object
      properties:
        type:
          type: string
          description: Auth type
          enum:

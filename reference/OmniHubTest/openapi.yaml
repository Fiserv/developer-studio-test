openapi: 3.1.0
info:
  title: Omnihub Onboarding API
  version: 2.15.2
servers:
- url: http://localhost:8081/omnihub/onboard
  description: Generated server url
tags:
- name: 1.0. Participant
  description: Operations to manage participant
- name: 1.1. Client
  description: Operations to manage client
- name: 1.2. Store
  description: Operations to manage store
- name: "2.0 [Sitef] Integrator"
  description: Operations to find the sitef integrator
- name: "2.1. [Card-Present] Integrator"
  description: Operations to find the proper integrator for card-present configurations
- name: "2.1. [Sitef] Administrative Groups"
  description: Operations to manage administrative groups. Represents Sitef Client
- name: "2.2. [Card-Present] Client"
  description: Operations to manage client configuration for card-present
- name: "2.2. [Sitef] Route Profile"
  description: Operations to manage route profile.
- name: "2.3. [Card-Present] Store"
  description: Operations to manage store configurations for card-present
- name: "2.3. [Sitef] Store"
  description: Operations to manage stores. Represents Sitef Store
- name: "2.4. [Card-Present] Payment Processor"
  description: Operation related to payment processor
- name: "2.4. [Sitef] Terminal Communication"
  description: Operation for terminal communication activation for card-present
- name: "2.5. [Card-Present] Payment Processor Routing"
  description: Operations to manage payment processor routings
- name: "2.6. [Card-Present] Initialization parameters"
  description: Operations related to initialization parameters process for card-present
- name: "2.7. [Card-Present] Terminal Communication"
  description: Operation for terminal communication activation for card-present
- name: "2.8. [card-present] Profile management"
  description: Operations to manage card present routing profiles
- name: "2.9 [card-present] Integrator Master Client"
  description: Operations related to card-present Client associated with the Master
    Integrator
- name: "3.0. [Carat] Store"
  description: Operations to manage stores. Represents E-Sitef Store
- name: "3.1. [PIX] Credential"
  description: Operations to manage PIX credentials
- name: "3.2. [PIX] Bind Credential"
  description: Operations to bind PIX credentials
- name: "3.3. [PIX] Route"
  description: Operations to manage PIX routes
- name: "3.4. [PIX] Payment Processors"
  description: Operation related to payment processor pix
- name: "3.5. [PIX] Migration"
  description: Operations to manage PIX migrations
- name: "4.0. [Pix Gateway] Account Holder"
  description: Operations to manage account holders. Represents Fepas Client
- name: "4.1. [PSP-FISERV] Accounts"
  description: Operations related to psp-fiserv account
- name: "4.1. [Pix Gateway] Store"
  description: Operations to manage the Pix Gateway Store's. Represents Fepas Store
- name: "4.2. [Pix Gateway] Credential"
  description: Operations to manage the Pix Gateway credentials
- name: "4.3. [Pix Gateway] PSP"
  description: Operations related to pix psp. Represents Fepas PSP
- name: "4.4. [Pix Gateway] Automatic Pix"
  description: Operations to manage the Pix Gateway Store's automatic pix
- name: 5.0 - Merchant Configuration
  description: |
    Endpoints for merchant configuration management, including registration, retrieval and updates of merchant configurations.
- name: 5.1 - Merchant Configuration Routes
  description: Route configuration endpoints
- name: 5.2 - Merchant Config Callbacks
  description: Merchant Config callback management endpoints
- name: 5.3 - Merchant Config Products
  description: Endpoints for managing merchant-config products
- name: 7.0. TEF
  description: Operations to manage TEF configuration
- name: 8.0. Unified Webhook Settings
  description: Operations for unified webhook settings in Omni and PSP-Fiserv
- name: 9.0. - ISV
  description: ISV API
- name: A.1 Protocol
  description: Operations to manage protocol
- name: A.2 Webhooks
  description: Operations for webhooks
- name: A1. Protocol
  description: Operations related to protocol
- name: A2. Auth v.1
  description: Operations for authentication (version 1)
- name: A2. Callback
  description: Operations related to callback
- name: A4. Event publisher
  description: Auxiliary data integration events

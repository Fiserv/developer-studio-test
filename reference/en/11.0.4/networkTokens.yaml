          description: provision response - Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: provision response - Bad Gateway Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: provision response - Service Unavailable error.
          content:

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /network-tokens/v1/tokens/{tokenReferenceId}/card:
    get:
      tags:
        - PAN
      x-group-name: Network Tokens
      x-proxy-name: Get Card
      description: This API will return the encrypted Card details associated with Network Token.
        <b>This API is rate limited and may start returning http 429 status if overused.</b>
      parameters:
        - in: header
          name: X-Card-Brand
          description: Card brand possible values are VI, MC, DI, AX, EO, TA, EP.
          required: true
          schema:
            $ref: '#/components/schemas/CardBrand'
        - in: header
          name: X-Request-Source
          description: This header is used to identify the source of the request. Default value - MERCHANT.
          required: true
          schema:
            $ref: '#/components/schemas/RequestSource'
        - in: header
          name: X-Token-Type
          description: This header is used to identify type of token is requested. Default value - ECOM.
          required: false
          schema:
            $ref: '#/components/schemas/TokenType'
        - in: header
          name: X-Key-Id
          description: This header is used to identify the key used to sign the request. Value of the header provided during Key Management API response.
          required: false
          schema:
            type: string
        - in: header
          name: Client-Request-Id
          description: Contains a unique ID generated by the client that can be used for enforcing idempotency on POST actions. POSTs are inherently non-idempotent and submitting the exact same request multiple times would create duplicate resources.
            Note:- Omitting this header increases the risk of duplicate transactions.
          required: true
          schema:
            type: string
        - in: header
          name: Timestamp
          description: Epoch timestamp in the request initiating system
          required: true
          schema:
            type: string
        - in: header
          name: Api-Key
          description: API and Secret key will be provided as part of service boarding.
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          description: Authorization information for the request. Format- `HMAC {hmacToken}`
          required: true
          schema:
            type: string
        - in: path
          name: tokenReferenceId
          description: The tokenReferenceId provided in response of /provision-tokens API. In Case of Visa & Mastercard(SCOF), use provisionTokenId from the /provision-tokens API response or from Notification request.
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Get Card Response - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCardResponse'
              examples:
                GetPanWithPan:
                  $ref: '#/components/examples/GetCardResponse'
                GetPANWithNoPan:
                  $ref: '#/components/examples/GetCardResponseNoCardInfo'
                GetPanResponseError:
                  $ref: '#/components/examples/GetPanResponseError'
        '400':
          description: provision response - Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: provision response - Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: provision response - not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '408':
          description: provision response - Request timeout error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: provision response - Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: provision response - Bad Gateway Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: provision response - Service Unavailable error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: provision response - Gateway Timeout error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:
  schemas:
    ##-------------------------------------
    ## Response Model
    ##-------------------------------------
    KeysResponse:
      title: Provides base64 encoded public key for PCI data encryption
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Keys'

    ProvisionQueueStatusResponse:
      title: Provides tokenization status
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        tokenReferenceId:
          description: Token reference id for stored token which is used to retrieve Card details
          type: string
          example: "8a7f87f68cef0334018cef506da80002"
        tspName:
          $ref: '#/components/schemas/CardBrand'

    NotificationRequest:
      title: Push notification request.
      type: object
      required:
        - notification
      properties:
        notification:
          $ref: '#/components/schemas/Notification'

    Notification:
      description: Notification request structure outbound to merchant using webhook.
      type: object
      required:
        - token
        - card
      properties:
        card:
          $ref: '#/components/schemas/Card'
        token:
          $ref: '#/components/schemas/Token'
        cardBrand:
          $ref: '#/components/schemas/CardBrand'
        transactionInfo:
          $ref: '#/components/schemas/TransactionInfo'
        eventType:
          $ref: '#/components/schemas/EventType'

    Keys:
      description: Keys response structure
      type: object
      required:
        - keyId
        - status
        - expireDate
        - publicKey
      properties:
        keyId:
          description: Id associated with key pair.
          type: string
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        status:
          description: Status of the Key pair.
          type: string
          example: "ACTIVE, INACTIVE, EXPIRED"
        expireDate:
          description: Expire date of the Key pair.
          type: string
          example: "2024-02-01T10:46:14.087458148"
        publicKey:
          description: Base64 encoded public key for PCI data encryption.
          type: string
          example: "base64_enc_string"

    CryptoGramRequest:
      title: Create CryptoGram request object model.
      type: object
      required:
        - cardBrand
        - transactionType
      properties:
        transactionType:
          $ref: '#/components/schemas/TransactionType'
        cardBrand:
          $ref: '#/components/schemas/CardBrand'
        merchantInfo:
          $ref: '#/components/schemas/MerchantInfo'
        locale:
          $ref: '#/components/schemas/Locale'
        customerInfo:
          $ref: '#/components/schemas/CustomerInfo'
        purchaseInfo:
          $ref: '#/components/schemas/PurchaseInfo'
        locationData:
          $ref: '#/components/schemas/LocationData'
        assuranceData:
          type: array
          items:
            $ref: '#/components/schemas/AssuranceData'

    CryptoGramResponse:
      title: Create CryptoGram response object model.
      type: object
      required:
        - token
        - crypto
      properties:
        token:
          $ref: '#/components/schemas/Token'
        crypto:
          $ref: '#/components/schemas/CryptoGram'

    ProvisionTokenRequest:
      title: Provision request object model
      type: object
      required:
        - provision
      properties:
        provision:
          $ref: '#/components/schemas/Provision'
        cardBrand:
          $ref: '#/components/schemas/CardBrand'
        locale:
          $ref: '#/components/schemas/Locale'
        purchaseInfo:
          $ref: '#/components/schemas/PurchaseInfo'

    UpdateTokenRequest:
      title: Provision request object model
      type: object
      required:
        - operation
        - updateReason
        - cardBrand
      properties:
        operation:
          $ref: '#/components/schemas/Operation'
        updateReason:
          $ref: '#/components/schemas/UpdateReason'
        cardBrand:
          $ref: '#/components/schemas/CardBrand'
        locale:
          description: locale code for country language
          type: string
          example: en_US
        merchantInfo:
          $ref: '#/components/schemas/MerchantInfo'
        customerInfo:
          $ref: '#/components/schemas/CustomerInfo'

    ProvisionQueueResponse:
      title: Provision response object model
      type: object
      required:
        - provision
      properties:
        clientRequestId:
          description: Request Id provided at the time of API call in the header - Client-Request-Id.
          type: string
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        provisionRequestId:
          description: Correlation Id generated by the MTRG after adding request to the queue.
          type: string
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        cardBrand:
          $ref: '#/components/schemas/CardBrand'
        createdDate:
          description: Time in when the request was added into the queue.
          type: string
          example: "2021-09-28T09:07:44.716+00:00"

    GetAssetResponse:
      title: Get Asset response object model
      type: object
      required:
        - mediaContents
      properties:
        mediaContentType:
          description: Type of the media content. Example:- digitalCardArt, cardSymbol, termsAndConditions etc.,
          type: string
          example: "cardSymbol"
        mediaAltText:
          description: Specifies an alternate text for a media content.
          type: string
          example: "Front_Image"
        mediaContents:
          $ref: '#/components/schemas/MediaContents'

    GetTokenResponse:
      title: Provision response object model
      type: object
      required:
        - provision
      properties:
        provision:
          $ref: '#/components/schemas/Provision'
        cardBrand:
          $ref: '#/components/schemas/CardBrand'

    ##-------------------------------------
    ## Object Model
    ##-------------------------------------
    Provision:
      description: Provision card information.
      type: object
      required:
        - card
      properties:
        card:
          $ref: '#/components/schemas/Card'
        panSource:
          $ref: '#/components/schemas/PanSource'
        tokenInfo:
          $ref: '#/components/schemas/TokenInfo'
        transactionType:
          $ref: '#/components/schemas/TransactionType'
        cryptogramRequired:
          description: If the flag is true then MTRG will first tokenize the card and then generate the Cryptogram also for that token. MTRG will make two API calls to networks. Once for Tokenization and other for Cryptogram.
          type: boolean
          example: false
          writeOnly: true
        merchantInfo:
          $ref: '#/components/schemas/MerchantInfo'
        customerInfo:
          $ref: '#/components/schemas/CustomerInfo'
        authorizationInfo:
          $ref: '#/components/schemas/AuthorizationInfo'
        issuerInfo:
          $ref: '#/components/schemas/IssuerInfo'
        locationData:
          $ref: '#/components/schemas/LocationData'
        assuranceData:
          type: array
          items:
            $ref: '#/components/schemas/AssuranceData'


    StepUpAuthorizationInfo:
      description: This is for 3DS details
      type: object
      readOnly: true
      properties:
        aevv:
          description: AEVV are related to EMV 3-D Secure authentication, a security protocol for online credit card transactions. AEVV, or American Express Verification Value, is a specific value generated by the card issuer during the authentication process.
          type: string
          example: "2d8a1360a27"
          maximum: 20
        eci:
          description: Required for Visa Tokenization for India issued PAN Only.
          type: string
          example: "xsc00z"

    IssuerInfo:
      description: Issuer metadata information.
      type: object
      readOnly: true
      properties:
        issuerMetaData:
          $ref: '#/components/schemas/IssuerMetaData'


    CardMetaData:
      description: Card metadata informations.
      type: object
      readOnly: true
      properties:
        cardType:
          description: Card type, Debit/Credit.
          type: string
          example: "Credit"
        cardBrandLogoAssetId:
          description: Logo asset associated with Card. UUID for uniqueness.
          type: string
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        cardBrandDescription:
          description: A short description for this product. Always returned in Product Configuration object.
          type: string
          example: "SHORT_DESCRIPTION"
        termsAndConditionsId:
          description: Id associated with terms and condition. UUID for uniqueness.
          type: string
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        foregroundColorRGB:
          description: Card Art foreground color.
          type: string
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        backgroundColorRGB:
          description: Card Art background color.
          type: string
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        labelColorRGB:
          description: Card Art label color.
          type: string
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    IssuerMetaData:
      description: Issuer metadata information's
      type: object
      readOnly: true
      properties:
        name:
          description: Issuer Name.
          type: string
          example: "Bank Of America"
          maximum: 36
        emailAddress:
          description: Email address associated with Issuer.
          type: string
          example: "test@somebank.com"
        contactNumber:
          description: Phone number associated with Issuer.
          type: string
          example: "800-245-0092"
          maximum: 10
        website:
          description: Issuer website
          type: string
          example: "https://somebank.com"
        privacyPolicy:
          description: Issuer website, privacy url.
          type: string
          example: "https://somebank.com/privacy"
        termsConditions:
          description: Issuer website, terms url.
          type: string
          example: "https://somebank.com/terms"

    PurchaseInfo:
      title: User purchase details.
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          example: 20.10
          description: |
            Transaction Amount, required if Card brand is EO, EFTPOS, Visa and Mastercard Agent Pay.
            
            **EFTPOS:**
            - Supports values with and without decimal
            - Supports only 2 digits after decimal
            - Minimum amount value supported is 0
            
            **Elo:**
            - Does not support values with decimal (only whole numbers)
            - Minimum amount value supported is 100
        currencyCode:
          type: string
          example: USD
          description: Aplha-3 ISO_4217 code.
        productDescription:
          type: string
          example: A pair of Nike Shoes
          description: Description of the product.
        productQuantity:
          type: integer
          example: 1
          description: Quantity of the product. Default to 1 if not provided.
        consumerPrompt:
          type: string
          example: Buy a pair of shoes from my mart.
          description: summary of the user prompt that lead to purchase.

    TransactionInfo:
      description: Details about provision request transaction.
      type: object
      properties:
        clientRequestId:
          description: Request Id provided by the client at the time of queue token API call in the header - Client-Request-Id.
          type: string
          maxLength: 75
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        provisionRequestId:
          description: Correlation Id generated by the MTRG after adding request to the queue.
          type: string
          maxLength: 75
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    MerchantInfo:
      description: Information about merchant - Required only for Rupay.
      type: object

      required:
        - merchantId
        - merchantName
        - merchantUrl
      properties:
        merchantId:
          description: Unique Id provided by frontend(north/south/memphis/oma) for a merchant at the time of boarding .
          type: string
          example: "54234509"
          maximum: 36
        merchantName:
          description: Name provided by the merchant at the time of boarding - Doing Business As.
          type: string
          example: "Microsoft LLC."
          maximum: 45
        merchantCategoryCode:
          type: string
          example: 0000
          description: (MCC) A four-digit number that classifies a business based on the goods or services it provides to the public.
        merchantCategory:
          type: string
          example: Electronics
          description: Merchant category Description.
        cardAcceptorId:
          description: A Card Acceptor ID (CAID) is a unique identifier assigned to a merchant by their acquiring bank or payment processor. Required for EFTPOS tokenization.
          type: string
          example: "9999999"
          maximum: 36
        acquirerId:
          description: An acquirer ID, also known as a Merchant ID (MID), is a unique identifier assigned to a merchant by their acquiring bank or payment processor.Required for EFTPOS tokenization.
          type: string
          example: "9999999999"
          maximum: 20
        merchantUrl:
          description: Merchant Url.
          type: string
          example: "https://bestbuy.com"

    CustomerInfo:
      description: Information about customer.
      type: object

      required:
        - consumerId

      properties:
        consumerId:
          description: Unique profile Id associated with each customer.Required for Rupay Tokenization Only.
          type: string
          example: "2d8a1360a24841e1a5677"
          maximum: 64
        isConsumerConsentReceived:
          description: Required for Visa Tokenization for India issued PAN Only.
          type: boolean
          example: true
        ipAddress:
          description: Customer IP Address.Required only when panSource is 'CARD_ADDED_MANUALLY'.
          type: string
          example: "127.0.0.0"
        phone:
          $ref: '#/components/schemas/Phone'
        email:
          $ref: '#/components/schemas/Email'

    Phone:
      description: Consumer Identity - Phone number information.
      type: object
      required:
        - countryCode
        - number
      properties:
        countryCode:
          description: ISO Country Phone Code.
          type: string
          example: "+1"
          maximum: 3
        number:
          description: Phone number.
          type: string
          example: "980-999-0001"
          maximum: 10

    Email:
      description: Consumer Identity - Email information.
      type: object
      required:
        - email
      properties:
        email:
          description: Customer email address.
          type: string
          example: "test@gmail.com"
          maximum: 100

    AssuranceData:
      description: Assurance data for 3DS authentication.
      type: object
      required:
        - verificationMethod
        - verificationResults
        - verificationTimestamp
      properties:
        methodResult:
          $ref: '#/components/schemas/MethodResults'
        verificationMethod:
          $ref: '#/components/schemas/VerificationMethod'
        verificationResults:
          $ref: '#/components/schemas/VerificationResults'
        verificationType:
          $ref: '#/components/schemas/VerificationType'
        verificationEvents:
          $ref: '#/components/schemas/VerificationEvents'
        verificationEntity:
          description: Entity performing the verification 10 - VISA (Default).
          type: string
          example: "10"
        verificationTimestamp:
          description: (Required) Date and time the verification occurred. UTC time in Unix epoch format.
          type: string
          example: "1750166824"

    MethodResults:
      description: Authentication/Verification Method Attributes.
      type: object
      properties:
        identifier:
          description: Unique Id for each method result.
          type: string
          example: "2d8a1360a24841e1a5677"
        dfpSessionId:
          description: (Conditional) Device Fingerprinting Session identifier. Conditionality, Required when authenticationMethodType is FIDO2.
          type: string
          example: "aa845d39-9ea1-4085-8e71-8d45e693655d"
        fidoAssertionData:
          $ref: '#/components/schemas/AssertionData'
        fidoAttestationData:
          $ref: '#/components/schemas/AttestationData'

    AssertionData:
      description: (Conditional) FIDO2 Assertion/Authentication Result Data Conditionality. Required when the authenticationMethodType is FIDO2 and the performed getDeviceAttestationOptions[action] is 'AUTHENTICATION' or 'ASSERTION'.
      type: object
      properties:
        code:
          description: (Conditional) An auth_code returned by Visa as part of the Visa Authentication Flow. This is the signature that is being registered. Conditionality, Required when code is not present during Assertion/Attestation when applicable. Field Mapping - FidoResponse.fidoBlob
          type: string
          example: "7bwd1EfMs4MWlmLeFGIhSONwer8hF1yWPs7b7-g1lYrOeNwUuCg9dsCrnKI0-A9BvrwMemw6K05reS2kUVkfu7KbwtLSzcF9BLUcGsrbtE-alrZ4MzRCGSMvJP6PVo-H_dKowL5DfNvt9ZElB9cWpaPkHo8Cvu4WvLaz42XSFK2fBfuKpCiCTIokEEuqjZrSANKeJGFzp3uqzDGn-X-_a8Gq0DcA-d7-p_9nyi5VMRv9TLjzVh5BFXfLJ_3J"

    AttestationData:
      description: (Conditional) FIDO2 Attestation/Registration Result Data Conditionality, Required when the authenticationMethodType is FIDO2 and the performed getDeviceAttestationOptions[action] is 'REGISTER' or 'ATTESTATION'.
      type: object
      properties:
        code:
          description: (Conditional) An auth_code returned by Visa as part of the Visa Authentication Flow. This is the signature that is being registered. Conditionality, Required when code is not present during Assertion/Attestation when applicable. Field Mapping - FidoResponse.fidoBlob
          type: string
          example: "7bwd1EfMs4MWlmLeFGIhSONwer8hF1yWPs7b7-g1lYrOeNwUuCg9dsCrnKI0-A9BvrwMemw6K05reS2kUVkfu7KbwtLSzcF9BLUcGsrbtE-alrZ4MzRCGSMvJP6PVo-H_dKowL5DfNvt9ZElB9cWpaPkHo8Cvu4WvLaz42XSFK2fBfuKpCiCTIokEEuqjZrSANKeJGFzp3uqzDGn-X-_a8Gq0DcA-d7-p_9nyi5VMRv9TLjzVh5BFXfLJ_3J"

    AuthorizationInfo:
      description: Information about Auth transaction.
      type: object

      required:
        - authRefNo

      properties:
        authRefNo:
          description: Unique Auth Id for the transaction created before tokenization. Required for Rupay Tokenization Only.
          type: string
          example: "2d8a1360a24841e1a5677"
          maximum: 36
        isAFAuthenticated:
          description: Required for Visa Tokenization for India issued PAN Only.
          type: boolean
          example: true
        threeDS:
          $ref: '#/components/schemas/StepUpAuthorizationInfo'

    GetCardResponse:
      description: Tokenized card details
      type: object
      properties:
        card:
          description: Card information
          type: object
          properties:
            cardNumber:
              description: Base 64 encoded encrypted card number. Use private key to decrypt card number
              type: string
              example: "base64_encoded_enc_pan_string"
            expiryDate:
              $ref: '#/components/schemas/ExpiryDate'
        token:
          description: Token details
          type: object
          properties:
            tokenReferenceId:
              description: Token reference id for stored token which is used to retrieve Card details
              type: string
              example: "8a7f87f68cef0334018cef506da80002"
        cardBrand:
          $ref: '#/components/schemas/CardBrand'
        status:
          $ref: '#/components/schemas/Status'
    Card:
      description: Card account Information.
      type: object
      required:
        - cardNumber
        - cardType
        - expiryDate
      properties:
        cardNumber:
          description: Primary account number, can only be sent when vaulting an account.  This field will NOT be present in responses.
          type: string
          example: "4111111111111111"
          writeOnly: true
        nameOnCard:
          type: string
          maxLength: 256
          description: 'Name of the cardholder. Required only for Elo Tokenization.'
          example: 'Jason Carlson'
        securityCode:
          type: string
          maxLength: 4
          description: 'Card Security Code (CSC).Required only for Elo Tokenization.'
          example: '111'
        alias:
          description: Last four values of the cardNumber
          type: string
          maxLength: 4
          readOnly: true
          example: "4567"
        cardBrandLogoAssetId:
          description: Asset associated with Card.
          type: string
          maxLength: 75
          example: "SOME_RANDOM_ID"
          readOnly: true
        cardBrandDescription:
          description: A short description for this product. Always returned in Product Configuration object.
          type: string
          example: "SHORT_DESCRIPTION"
          readOnly: true
        expiryDate:
          $ref: '#/components/schemas/ExpiryDate'
        cardMetaData:
          $ref: '#/components/schemas/CardMetaData'

    CryptoGram:
      description: Cryptogram response to merchant.
      type: object
      required:
        - cryptogram
        - eci
      properties:
        cryptogram:
          description: The unique cryptogram valid only for a specific transaction.
          type: string
          readOnly: true
          example: "5001a9f027e5629d11e3949a0800a"
        expire:
          description: Expiry period of the dynamic data in UTC Format.
          type: string
          readOnly: true
          example: "2022-10-07T13:44:45.385Z"
        type:
          $ref: '#/components/schemas/CryptogramType'
        eci:
          description: EC indicator for liability shift.
          type: string
          readOnly: true
          example: "12345"

    ExpiryDate:
      description: Contains account expiration data and needs to either send the values in individual fields OR as a singleValue.
      type: object
      required:
        - month
        - year
      properties:
        month:
          type: string
          description: Month format 'MM'
          pattern: "[0-9]{2,2}"
          minLength: 2
          maxLength: 2
          example: "09"
        year:
          type: string
          description: Year format 'YY'
          pattern: "[0-9]{2,2}"
          minLength: 2
          maxLength: 2
          example: "20"

    NVP:
      title: Name and Value pair.
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        valueAsList:
          type: array
          minItems: 0
          items:
            type: string

    TokenInfo:
      description: Information related to network Tokens and reference Ids.
      type: object
      readOnly: true
      required:
        - token
      properties:
        decision:
          $ref: '#/components/schemas/TokenStatus'
        token:
          $ref: '#/components/schemas/Token'

    Token:
      description: Network Tokens Information.
      type: object
      readOnly: true
      properties:
        tokenReferenceId:
          description: A unique reference assigned following the allocation of a token used to identify the token for the duration of its lifetime.
          type: string
          maxLength: 100
          example: "5001a9f027e5629d11e3949a0800a"
          readOnly: true
        expiryDate:
          $ref: '#/components/schemas/ExpiryDate'
        alias:
          description: Last four values of the token
          type: string
          maxLength: 4
          example: "1111"
          readOnly: true
        paymentAccountReferenceId:
          description: The unique account reference assigned to the PAN. Conditionally returned if the Token Requestor has opted to receive PAR and providing PAR is assigned by networks or the Issuer provides PAR in the authorization message response. This is base64 encoded encrypted string.
          type: string
          maxLength: 1000
          readOnly: true
          example: "5001a9f027e5629d11e3949a0800a"
        tokenRequestorId:
          description: Unique ID that identifies the entity for which the token request is being conducted.
          type: string
          maxLength: 200
          readOnly: true
          example: "2901"
        fiservTokenRequestorId:
          description: Unique ID mapes to tokenRequestorId. Unique per merchant.
          type: string
          maxLength: 75
          readOnly: true
          example: "MSTF-2901"
        paymentToken:
          description: The Token for a PAN. This should be used for auth. This is base64 encoded encrypted sting.
          type: string
          maxLength: 1000
          readOnly: true
          example: "5001a9f027e5629d11e3949a0800a"
        provisionTokenId:
          description: This will be returned only for VISA tokenization.
          type: string
          maxLength: 75
          readOnly: true
          example: "6001a9f027e5629d11e3949a0800a"
        panSequenceNumber:
          type: string
          maxLength: 4
          description: 'Pan sequence number for Auth.'
          readOnly: true
          example: '00'
        track2Equivalent:
          type: string
          maxLength: 256
          description: 'Information such as the Expiration Date, Primary Account Number, etc. encoded on Track 2 magnetic stripe.'
          readOnly: true
          example: '5204736200176909D25041000000000000000F'
        tokenStatus:
          $ref: '#/components/schemas/TokenStatus'
        reason:
            description: Reason for the token status update. Provided only for Mastercard SCOF and Amex.
            type: string
            maxLength: 50
            example: "Issuer Deleted Token"
        taToken:
            description: TransArmor Token Number. Optional.
            type: string
            maxLength: 75
            example: "4901000011112222"

    UpdateReason:
      description: Information related to network Tokens
      type: object
      required:
        - causedBy
        - reasonCode
      properties:
        causedBy:
          $ref: '#/components/schemas/CausedBy'
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        reason:
          description: Free form reason why the Tokens are being suspended.
          type: string
          example: "Lost/stolen device"
    Locale:
      description: This attribute will determine the routing endpoint for VI and MC request. Default - blank; Valid value - `hi_IN` only
      type: string
      example: "hi_IN"

    MediaContents:
      description: Provision card information.
      type: object
      required:
        - mimeType
        - data
        - height
        - width
      properties:
        mimeType:
          description: Specified as a MIME type, which will be one of the following supported types application/pdf (for images must be a vector PDF image) image/png (includes alpha channel) text/plain text/html
          type: string
          example: "text/plain"
        data:
          description: The data for this item of media. Base64-encoded data, given in the format as specified in 'type'.
          type: string
          example: "encrypted_data binary"
          readOnly: true
        height:
          description: For image assets, the height of this image. Specified in pixels.
          type: string
          example: "1024"
          readOnly: true
        width:
          description: For image assets, the width of this image. Specified in pixels.
          type: string
          example: "750"
          readOnly: true

    LocationData:
      description: Location information of the device
      type: object
      required:
        - ipAddress
      properties:
        ipAddress:
          description: Device Unique Id
          type: string
          example: "192.168.1.11"
        latitude:
          description: location information
          type: string
          example: "40.753°"
        longitude:
          description: location information.
          type: string
          example: "-73.983°"
        applicationName:
          description: Name of the application calling API.
          type: string
          example: "My sample mobile app"
        countryCode:
          description: 2 Digit ISO 3166-1 alpha-2 Country Code.
          type: string
          example: "US"
        locale:
          $ref: '#/components/schemas/Locale'
        deviceData:
          $ref: '#/components/schemas/DeviceData'

    DeviceData:
      description: Physical device data.
      type: object
      required:
        - deviceId
        - userAgent
        - model
        - type
        - brand
        - manufacturer
      properties:
        deviceId:
          description: Device Unique Id
          type: string
          example: "01c23ed3ac792109b915f83378"
        userAgent:
          description: Device browser user agent information.
          type: string
          example: "Mozilla/5.0"
        model:
          description: Devide manufacturer model.
          type: string
          example: "Samsung Pro Max"
        type:
          description: Type of device. Web, Mobile, TV, Desktop, Tablet.
          type: string
          example: "Mobile"
        brand:
          description: Brand of the device.
          type: string
          example: "Samsung"
        manufacturer:
          description: Manufacturer of the device.
          type: string
          example: "Samsung"

    #-------------------------------------
    # Common Models
    #-------------------------------------
    Error:
      description: Model for error messaging
      type: object
      properties:
        code:
          type: string
          description: Uniquely identifies an error condition. Client applications need to read and handle errors based on this.
        message:
          type: string
          description: A generic description of the error condition.
        category:
          type: string
          description: The resource associated with the error condition.
        developerInfo:
          type: object
          description: Information that needs to be understood by the client developers and should not be interpreted for application processing.
          properties:
            developerMessage:
              type: string
              description: An elaborative description of the error description.
            moreInfo:
              type: string
              description: Link to the error in Developer page.
            fieldError:
              description: Detailed information about message format errors.
              type: array
              items:
                properties:
                  field:
                    description: The property or attribute associated with the error
                    type: string
                  message:
                    description: Information specific to a property or attribute.
                    type: string
        hostExtraInfo:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/NVP'
          uniqueItems: true
      example:
        code: "40000"
        message: "Example Error"
        category: "example"
        developerInfo:
          developerMessage: "Invalid Message format in request payload"
          moreInfo: "https://www.example.com/errors/40000"
          fieldError:
            - field: "example id"
              message: "exampleId is mandatory"

    #-------------------------------------
    # ENUM Models
    #-------------------------------------
    VerificationMethod:
      description: (Required) Method of the verification.
      type: string
      enum:
        - 02 //App-based authentication
        - 04 //One-time passcode
        - 21 //Visa Token Service step-up- Device binding
        - 22 //Visa Token Service step-up
        - 23 //FIDO2

    VerificationResults:
      description: (Required) Result of the verification
      type: string
      enum:
        - 01 //Verified
        - 02 //Not Verified
        - 03 //Not performed
        - 04 //Not required
        - 21 //Not allowed

    VerificationType:
      description: Type of the verification data. Default value is CARDHOLDER.
      type: string
      enum:
        - CARDHOLDER
        - DEVICE

    VerificationEvents:
      description: (Optional) Event where the verification occurred.
      type: integer
      enum:
        - 01 //Payment transaction
        - 02 //Add card/Card enrollment
        - 03 //Profile access
        - 04 //Account verification

    TokenStatus:
      description: Indicates the status of a token.
      type: string
      maxLength: 50
      readOnly: true
      enum:
        - ACTIVE
        - INACTIVE
        - SUSPENDED
        - DEACTIVATED
        - DECLINED
        - APPROVED
        - DELETED

    Operation:
      description: Indicates the type of operation to be performed. Applicable values are defined below.
      type: string
      enum:
        - SUSPEND
        - RESUME
        - DELETE
        - REISSUE
        - UPDATE

    CardBrand:
      description: Indicates the Network associated with PAN.  Probable values are define as enum.
      type: string
      maxLength: 2
      enum:
        - VI - Visa
        - AX - Amex
        - DI - Discover
        - MC - Mastercard
        - RU - Rupay
        - EO - ELO
        - TA - TransArmor
        - EP - EFTPOS

    RequestSource:
      description: Indicates the source of the request. Probable values are define as enum.
      type: string
      enum:
        - MERCHANT
        - NTI

    TokenType:
      description: Indicates the source of the request. Probable values are define as enum.
      type: string
      enum:
        - AGENT_PAY
        - ECOM

    CausedBy:
      description: Who or what caused the Token to be suspended. Must be either the 'CARDHOLDER' (operation requested by the Cardholder) or 'TOKEN_REQUESTOR' (operation requested by the token requestor).
      type: string
      enum:
        - CARDHOLDER
        - TOKEN_REQUESTOR

    ReasonCode:
      description: The reason for the action to be suspended. Must be one of 'SUSPECTED_FRAUD' (suspected fraudulent token transactions), 'OTHER' (Other - default used if value not provided).
      type: string
      enum:
        - FRAUD
        - CUSTOMER_CONFIRMED
        - OTHER

    CryptogramType:
      type: string
      description: Type of dynamic data required by the integrator to support a checkout request.
      enum:
        - DSRP - CARD_APPLICATION_CRYPTOGRAM_SHORT_FORM
        - DTVC - DYNAMIC_CARD_SECURITY_CODE
        - TAVV - TOKEN_AUTHENTICATION_VERIFICATION_VALUE
        - DTVV - DYNAMIC_TOKEN_VERIFICATION_VALUE

    TransactionType:
      description: ECOM-e-commerce transactiontype. To be used with web flows. RECURRING-Recurring payment. If not provided in request, default value will be ECOM
      type: string

      enum:
        - ECOM
        - RECURRING

    PanSource:
      description: Source of the payment instrument (PAN). This enum value specifies the source and the method used to provide the payment instrument data. If not provided in request, default value will be CARD_ON_FILE
      type: string

      enum:
        - CARD_ON_FILE
        - CARD_ADDED_MANUALLY
        - ISSUER_PUSH_PROVISION
        - TOKEN_FOR_TOKEN
        - CARD_ADDED_VIA_APPLICATION
        - BATCH


    EventType:
      description: The notification webhook API is to send two different type of notifications.If eventType is TOKEN_LIFECYCLE_EVENT, Merchant should use tokenRequestorId to correlate the system of record. If eventType is PROVISION_TOKEN_EVENT, merchant should user provisionRequestId to correlate the system of record.
      type: string
      maxLength: 50
      enum:
        - PROVISION_TOKEN_EVENT
        - TOKEN_LIFECYCLE_EVENT
        - PAN_UPDATE_EVENT
        - TOKEN_MIGRATION_EVENT

    Status:
      description: Status of the token & associated PAN.
      type: string
      enum:
        - CARD_UPDATE_INPROGRESS
        - CARD_UP_TO_DATE
        - CARD_UPDATE_ERROR
        - TOKENIZATION_INPROGRESS
        - TOKENIZATION_COMPLETED
        - TOKENIZATION_ERROR
        - DUPLICATE_REQUEST

          description: The tokenReferenceId provided in response of /provision-tokens API. In Case of Visa & Mastercard(SCOF), use provisionTokenId from the /provision-tokens API response or from Notification request.
          required: true
          schema:
            type: string

      requestBody:
        description: Details required to manage token lifecycle.
        required: true
        content:

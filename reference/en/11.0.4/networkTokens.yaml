#######################################################################
## Added X-Card-Brand header to all the APIs to route the request to the right adapter.
## Removed tokenReferenceId from Asset API. It's not required by Token Provider.
## Added Public keye nec API.
## Added a new eventype for PAN Data notification as part of CAU process.
## Added token object in Card API.
## Update in notification payload. Encryption added as part of notificaiton.
## Message attribute if real time CAU fails.
## Added a new event type for token migration notification
## Added Token4Token in provision request example.externalDocs:
## Added 3DS object model.
## ADDed EPAL example for cryptogram request.
## Added X-Request-Source and X-Token-Type headers.
#######################################################################
openapi: 3.0.0
info:
  version: 1.0.8
  title: Network Supported APIs
  description: This Specification document lists the APIs for Token Provision and its Lifecycle Management.

servers:
  - url:  https://connect-qa.fiservapis.com
  - url:  https://connect-cert.fiservapis.com
  - url:  https://connect.fiservapis.com

paths:
  /network-tokens/v1/tokens:
    post:
      tags:
        - Provision Token
      x-group-name: Network Tokens
      x-proxy-name: Provision Token
      description: This API will provision a Network Token for a PAN associated with the underlying issuer and card brands like Visa, Master Card, American Express and Discover.
      parameters:
        - in: header
          name: X-Card-Brand
          description: Card brand possible values are VI, MC, DI, AX, EO, TA, EP.
          required: true
          schema:
            $ref: '#/components/schemas/CardBrand'
        - in: header
          name: X-Request-Source
          description: This header is used to identify the source of the request. Default value - MERCHANT.
          required: true
          schema:
            $ref: '#/components/schemas/RequestSource'
        - in: header
          name: X-Token-Type
          description: This header is used to identify type of token is requested. Default value - ECOM.
          required: true
          schema:
            $ref: '#/components/schemas/TokenType'
        - in: header
          name: X-Key-Id
          description: This header is used to identify the key used to sign the request. Value of the header provided during Key Management API response.
          required: true
          schema:
            type: string
        - in: header
          name: Client-Request-Id
          description: Contains a unique ID generated by the client that can be used for enforcing idempotency on POST actions. POSTs are inherently non-idempotent and submitting the exact same request multiple times would create duplicate resources.
            Note:- Omitting this header increases the risk of duplicate transactions.
          required: true
          schema:
            type: string
        - in: header
          name: Timestamp
          description: Epoch timestamp in the request initiating system
          required: true
          schema:
            type: string
        - in: header
          name: Api-Key
          description: API and Secret key will be provided as part of service boarding.
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          description: Authorization information for the request. Format- `HMAC {hmacToken}`
          required: true
          schema:
            type: string

      requestBody:
        description: Details required for provision a PAN data.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTokenRequest'
            examples:
              NetworkToken:
                $ref: '#/components/examples/ProvisionTokenRequest'
              T4TNetworkToken:
                $ref: '#/components/examples/ProvisionTokenT4TRequest'
              EPALProvisionTokenRequest:
                $ref: '#/components/examples/EPALProvisionTokenRequest'
              AgenticPayProvisionTokenRequest:
                $ref: '#/components/examples/AgenticPayProvisionTokenRequest'

      responses:
        '201':
          description: provision response - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionQueueResponse'
              examples:
                ProvisionQueueResponse:
                  $ref: '#/components/examples/ProvisionQueueResponse'

        '400':
          description: provision response - Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: provision response - Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '408':
          description: provision response - Request timeout error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: provision response - Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: provision response - Bad Gateway Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: provision response - Service Unavailable error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: provision response - Gateway Timeout error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /network-tokens/v1/tokens/{provisionRequestId}/status:
    get:
      tags:
        - Provision Token Status
      x-group-name: Network Tokens
      x-proxy-name: Provision Token Status
      description: This API will return the current provisioning status of a Network Token. Provisioning requests are immediately followed by web hook notifications. This API can be used additionally to request the provisioning status.
        <b>This API is rate limited and may start returning http 429 status if overused.</b>
      parameters:
        - in: header
          name: X-Card-Brand
          description: Card brand possible values are VI, MC, DI, AX, EO, TA, EP.
          required: true
          schema:
            $ref: '#/components/schemas/CardBrand'
        - in: header
          name: X-Request-Source
          description: This header is used to identify the source of the request. Default value - MERCHANT.
          required: true
          schema:
            $ref: '#/components/schemas/RequestSource'
        - in: header
          name: X-Token-Type
          description: This header is used to identify type of token is requested. Default value - ECOM.
          required: false
          schema:
            $ref: '#/components/schemas/TokenType'
        - in: header
          name: X-Key-Id
          description: This header is used to identify the key used to sign the request. Value of the header provided during Key Management API response.
          required: false
          schema:
            type: string
        - in: header
          name: Client-Request-Id
          description: Contains a unique ID generated by the client that can be used for enforcing idempotency on POST actions. POSTs are inherently non-idempotent and submitting the exact same request multiple times would create duplicate resources.
            Note:- Omitting this header increases the risk of duplicate transactions.
          required: true
          schema:
            type: string
        - in: header
          name: Timestamp
          description: Epoch timestamp in the request initiating system
          required: true
          schema:
            type: string
        - in: header
          name: Api-Key
          description: API and Secret key will be provided as part of service boarding.
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          description: Authorization information for the request. Format- `HMAC {hmacToken}`
          required: true
          schema:
            type: string
        - in: path
          name: provisionRequestId
          description: provisionRequestId provided in response during tokenization.
          required: true
          schema:
            type: string

      responses:
        '201':
          description: provision response - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionQueueStatusResponse'
              examples:
                ProvisionQueueInProgressStatus:
                  $ref: '#/components/examples/ProvisionQueueStatusInProgressResponse'
                ProvisionQueueSuccessStatus:
                  $ref: '#/components/examples/ProvisionQueueStatusSuccessResponse'

        '400':
          description: provision response - Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: provision response - Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '408':
          description: provision response - Request timeout error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: provision response - Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: provision response - Bad Gateway Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: provision response - Service Unavailable error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: provision response - Gateway Timeout error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


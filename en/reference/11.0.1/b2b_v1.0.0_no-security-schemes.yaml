openapi: 3.0.3
info:
  title: Deckard (B2B Gateway)
  version: '1.0'
servers:
  - url: https://api.uat.payfarelabs.com
paths:
  /v1/no-security-scheme/payouts/{payout_id}:
    get:
      x-group-name: b2b
      x-proxy-name: Check Payout Status No Security Scheme
      summary: Check Payout Status
      description: View the status of the payout
      operationId: check-payout-status
      parameters:
        - name: payout_id
          in: path
          description: The UUID generated by Payfare for this payout.
          schema:
            type: string
            default: c5cd8f05-5882-4a63-931d-1490111a7c5e
          required: true
        - name: X-PFClient-Key
          in: header
          schema:
            type: string
            example: 'API key'
          required: true
          description: 'API Key'
        - name: X-PFClient-Secret
          in: header
          schema:
            type: string
            example: API Secret
          required: true
          description: 'API Secret'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
x-readme:
  headers: []
  explorer-enabled: false
  proxy-enabled: true
x-readme-fauxas: true
